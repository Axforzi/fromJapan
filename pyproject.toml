[project]
name = "fromjapan"
version = "1.0.0"
description = "Catálogo web de contenido japonés: anime, manga y novelas ligeras."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.3",
    "Flask-Login>=0.6.3",
    "mongoengine>=0.28.2",
    "pymongo>=4.7.3",
    "python-dotenv>=1.0.1",
    "waitress>=3.0.0",
    "Werkzeug>=3.0.3",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
